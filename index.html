    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-nexus-dark text-white font-sans antialiased overflow-x-hidden min-h-screen;
            }
            h1, h2, h3, h4, h5, h6 {

        }
        @layer components {
            .glass-panel {
                @apply bg-transparent backdrop-blur-none border-0 rounded-none transition-all duration-300 relative overflow-hidden;
            }
            .btn-primary {
                @apply relative overflow-hidden px-8 py-3 rounded-lg bg-gradient-to-r from-nexus-blue to-nexus-purple text-white font-semibold transition-all duration-300 hover:shadow-[0_0_25px_rgba(0,184,255,0.4)] hover:-translate-y-1 hover:scale-105;
            }
            .btn-primary::after {
                content: '';
                @apply absolute top-0 left-0 w-[200%] h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -skew-x-12 translate-x-[-150%] transition-transform duration-700 ease-in-out;
            }
            .btn-primary:hover::after {
                @apply translate-x-[50%];
            }
            .btn-secondary {
                @apply relative px-8 py-3 rounded-lg border border-nexus-accent/50 text-white font-semibold hover:bg-nexus-blue/10 hover:border-nexus-accent transition-all duration-300 hover:shadow-[0_0_15px_rgba(59,130,246,0.4)] hover:-translate-y-1;
            }
            .tab-pane {
                @apply hidden opacity-0 translate-y-6 transition-all duration-500 ease-out;
            }
            .tab-pane--active {
                @apply block opacity-100 translate-y-0;
            }
        }
        .button {
            position: relative;
            display: inline-flex;
            overflow: hidden;
            border-radius: 9999px;
            padding: 2px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.3s ease;
        }
 
        .button::before {
            content: "";
            position: absolute;
            inset: -1000%;
            background: linear-gradient(90deg, #10b981, #34d399, #10b981);
            animation: spin 2s linear infinite;
        }
 
        .button:hover {
            transform: scale(1.05);
        }
 
        .button-content {
            position: relative;
            display: inline-flex;
            height: 100%;
            width: 100%;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background: #090d16;
            padding: 0.75rem 1.25rem;
            backdrop-filter: blur(24px);
            transition: background-color 0.3s ease;
        }
 
        .button:hover .button-content {
            background-color: rgba(9, 13, 22, 0.9);
        }
 
        .button-icon {
            height: 20px;
            width: 20px;
            color: #10b981;
            transition: transform 0.3s ease;
        }
 
        .button:hover .button-icon-left {
            transform: translateX(-3px);
        }
 
        .button:hover .button-icon-right {
            transform: translateX(3px);
        }
 
        .button-icon-right {
            color: #10b981;
        }
        .gradient-text {
            @apply bg-clip-text text-transparent bg-gradient-to-r from-nexus-accent via-[#18E7FF] to-nexus-glow;
        }
        .container {
            height: 100%;
            width: 100%;
            background: radial-gradient(ellipse at bottom, #16241d 0%, #090d16 100%);
            overflow: hidden;
        }

@keyframes animStar {
